server:
  port: ${PORT:8761}

spring:
  application:
    name: discovery-server

eureka:
  client:
    # The registry does not register with itself.
    register-with-eureka: false
    fetch-registry: false
  server:
    # Small cluster on one machine: drop dead instances quickly instead of protecting them.
    enable-self-preservation: false
    eviction-interval-timer-in-ms: 5000

management:
  endpoints:
    web:
      exposure:
        include: health,info
