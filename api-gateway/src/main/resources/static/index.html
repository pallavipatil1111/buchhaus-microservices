<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BuchHaus · Books delivered across India</title>
  <meta name="description" content="BuchHaus online bookstore: Indian writing, classics, technology and more.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231f3a5f'/%3E%3Cpath d='M8 9h7a3 3 0 013 3v12a3 3 0 00-3-3H8zM24 9h-5a3 3 0 00-3 3v12a3 3 0 013-3h5z' fill='%23f5c26b'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/app.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/" data-cy="home"><span class="logo" aria-hidden="true"></span><span>Buch<b>Haus</b></span></a>
    <form class="search" id="search-form" role="search">
      <input type="search" id="search" placeholder="Search by title or author" aria-label="Search books" data-cy="search">
    </form>
    <nav class="nav">
      <a href="#/admin" id="admin-link" hidden data-cy="admin-link">Admin</a>
      <a href="#/orders" id="orders-link" hidden>Orders</a>
      <a href="#/login" id="login-link" data-cy="login-link">Sign in</a>
      <button class="link" id="logout" hidden type="button">Sign out</button>
      <a href="#/cart" class="cart-link" data-cy="cart-link" aria-label="Cart">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h2l2.4 10.2a2 2 0 002 1.6h7.7a2 2 0 001.9-1.4L21 8H6.2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="10" cy="20" r="1.4" fill="currentColor"/><circle cx="17" cy="20" r="1.4" fill="currentColor"/></svg>
        <span class="badge" id="cart-count" data-cy="cart-count">0</span>
      </a>
    </nav>
  </header>
  <main id="view" aria-live="polite"></main>
  <footer class="footer">Free delivery on orders from ₹499 · Cash on delivery and UPI accepted · Pune, India</footer>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <dialog id="book-dialog" class="dialog">
    <form id="book-form" class="stack" novalidate>
      <h2 id="book-dialog-title">Add a book</h2>
      <div class="grid2">
        <label>SKU <input name="sku" required placeholder="BH-0100" data-cy="f-sku"></label>
        <label>Genre <input name="genre" required list="genre-list" data-cy="f-genre"></label>
      </div>
      <label>Title <input name="title" required maxlength="160" data-cy="f-title"></label>
      <label>Author <input name="author" required maxlength="120" data-cy="f-author"></label>
      <div class="grid3">
        <label>Price (₹) <input name="price" type="number" step="0.01" min="0" required data-cy="f-price"></label>
        <label>Stock <input name="stock" type="number" min="0" required data-cy="f-stock"></label>
        <label>Year <input name="publishedYear" type="number" min="1450" max="2100"></label>
      </div>
      <label>Pages <input name="pages" type="number" min="1"></label>
      <label>Description <textarea name="description" rows="3" maxlength="2000"></textarea></label>
      <p class="form-error" role="alert"></p>
      <div class="dialog-actions"><span class="spacer"></span>
        <button class="btn ghost" type="button" data-close>Cancel</button>
        <button class="btn primary" type="submit" data-cy="f-save">Save</button>
      </div>
    </form>
  </dialog>
  <datalist id="genre-list"></datalist>
</body>
</html>
