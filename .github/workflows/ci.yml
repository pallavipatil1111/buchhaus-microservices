name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Unit + service integration tests (H2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and test all modules
        run: mvn -B verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-reports
          path: "*/target/site/jacoco"

  mysql:
    name: Service integration tests on MySQL 8 (one database per service)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=5s --health-timeout=3s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Create the three databases
        run: mysql -h 127.0.0.1 -uroot -proot -e "CREATE DATABASE users; CREATE DATABASE catalog; CREATE DATABASE orders;"
      - name: Install the shared module
        run: mvn -B -q -pl common -am install -DskipTests
      - name: user-service on MySQL
        env:
          DB_URL: jdbc:mysql://127.0.0.1:3306/users?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
          DB_USER: root
          DB_PASSWORD: root
        run: mvn -B -pl user-service test -Dtest=UserApiTest
      - name: catalog-service on MySQL (real row locks)
        env:
          DB_URL: jdbc:mysql://127.0.0.1:3306/catalog?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
          DB_USER: root
          DB_PASSWORD: root
        run: mvn -B -pl catalog-service test -Dtest=CatalogApiTest
      - name: order-service on MySQL
        env:
          DB_URL: jdbc:mysql://127.0.0.1:3306/orders?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
          DB_USER: root
          DB_PASSWORD: root
        run: mvn -B -pl order-service test -Dtest=OrderApiTest

  stack:
    name: Docker Compose stack - Playwright + resilience test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start all six containers
        run: docker compose up -d --build --wait --wait-timeout 600
      - name: Wait until the gateway can route to every service
        run: scripts/wait-for-stack.sh
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright
        working-directory: e2e
        run: |
          npm install
          npx playwright install --with-deps chromium
      - name: End-to-end tests through the gateway
        working-directory: e2e
        env:
          CI: "true"
          BASE_URL: http://localhost:8080
        run: npx playwright test
      - name: Resilience test (stop the catalogue, check degradation and recovery)
        run: scripts/resilience-test.sh
      - name: Container logs
        if: failure()
        run: docker compose logs --no-color > compose.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-report
          path: |
            e2e/playwright-report
            compose.log
